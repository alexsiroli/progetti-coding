<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetti Coding</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&display=swap');

    :root {
      --primary-color: #FF6B6B;
      --secondary-color: #4ECDC4;
      --accent-color: #FFE66D;
      --text-color: #2C3E50;
      --bg-color: #F7F9FC;
      --card-bg: #FFFFFF;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(var(--secondary-color) 2px, transparent 2px);
      background-size: 30px 30px;
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      background-color: var(--primary-color);
      width: 100%;
      padding: 2rem 1rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -10%;
      width: 50%;
      height: 200%;
      background: rgba(255, 255, 255, 0.1);
      transform: rotate(30deg);
    }

    h1 {
      color: white;
      font-size: 3rem;
      margin: 0;
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
      letter-spacing: 1px;
    }

    header h2 {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.5rem;
      margin-top: 0.5rem;
      font-weight: 400;
    }

    .container {
      max-width: 1200px;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      padding-bottom: 3rem;
    }

    .class-selector {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .class-btn {
      background-color: var(--card-bg);
      border: 3px solid var(--secondary-color);
      color: var(--text-color);
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      font-size: 1.2rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .class-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(78, 205, 196, 0.3);
      background-color: var(--secondary-color);
      color: white;
    }

    .class-btn.active {
      background-color: var(--secondary-color);
      color: white;
      box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.1);
      transform: translateY(1px);
    }

    .projects-area {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
      width: 100%;
    }

    .project-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 5px solid var(--accent-color);
    }

    .project-card:hover {
      transform: translateY(-10px) rotate(1deg);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
    }

    .student-name {
      font-size: 1.4rem;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .project-link {
      display: inline-block;
      margin-top: auto;
      text-decoration: none;
      background-color: var(--accent-color);
      color: var(--text-color);
      padding: 0.8rem 1.2rem;
      border-radius: 15px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .project-link:hover {
      background-color: #ffd633;
    }

    .project-title {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #666;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 1.5rem;
      color: #888;
      padding: 3rem;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      border: 2px dashed #ccc;
    }

    .iframe-container {
      width: 100%;
      aspect-ratio: 580 / 560;
      background: #f0f0f0;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1rem;
      border: 2px solid var(--secondary-color);
    }

    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Decorations */
    .decoration {
      position: fixed;
      z-index: -1;
      opacity: 0.5;
    }

    .dec-1 {
      top: 10%;
      left: 5%;
      width: 100px;
      height: 100px;
      background: #FFD93D;
      border-radius: 50%;
    }

    .dec-2 {
      bottom: 10%;
      right: 5%;
      width: 150px;
      height: 150px;
      background: #6BCB77;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .dec-3 {
      bottom: 20%;
      left: 10%;
      width: 80px;
      height: 80px;
      background: #4D96FF;
      transform: rotate(45deg);
    }
  </style>
</head>

<body>

  <div class="decoration dec-1"></div>
  <div class="decoration dec-2"></div>
  <div class="decoration dec-3"></div>

  <header>
    <h1>Progetti Coding 2025/2026</h1>
    <h2>Prof. Alex Siroli</h2>
  </header>

  <div class="container">
    <div class="class-selector" id="classSelector">
      <!-- Buttons will be generated by JS -->
    </div>

    <div class="projects-area" id="projectsArea">
      <div class="empty-state">Seleziona una classe per vedere i progetti!</div>
    </div>
  </div>

  <script>
    const classes = [
      { name: "2A Anna Frank", id: "2a_anna_frank" },
      { name: "2A Ronta", id: "2a_ronta" },
      { name: "2O Plauto", id: "2o_plauto" },
      { name: "5 Saffi", id: "5_saffi" },
      { name: "5A Vigne", id: "5a_vigne" }
    ];

    const classSelector = document.getElementById('classSelector');
    const projectsArea = document.getElementById('projectsArea');

    // Initialize buttons
    classes.forEach(cls => {
      const btn = document.createElement('button');
      btn.className = 'class-btn';
      btn.textContent = cls.name;
      btn.onclick = () => loadProjects(cls.id, btn);
      classSelector.appendChild(btn);
    });

    async function loadProjects(classId, clickedBtn) {
      // Update UI for active button
      document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
      clickedBtn.classList.add('active');

      // Show loading
      projectsArea.innerHTML = '<div class="empty-state">Caricamento...</div>';

      try {
        const response = await fetch(`data/${classId}.json`);
        if (!response.ok) throw new Error('File not found');
        const data = await response.json();
        renderProjects(data);
      } catch (error) {
        console.error(error);
        projectsArea.innerHTML = '<div class="empty-state">Nessun progetto trovato o errore di caricamento (assicurati di usare un server web).</div>';
      }
    }

    function renderProjects(data) {
      projectsArea.innerHTML = '';

      if (!data || data.length === 0) {
        projectsArea.innerHTML = '<div class="empty-state">Ancora nessun progetto inserito per questa classe!</div>';
        return;
      }

      data.forEach(entry => {
        // If entry has a list of projects under one student/group name
        if (entry.projects && Array.isArray(entry.projects)) {
          entry.projects.forEach(proj => {
            const card = createProjectCard(entry.student, proj.name, proj.url);
            projectsArea.appendChild(card);
          });
        } else if (entry.name && entry.url) {
          // Direct project entry or flat structure
          const card = createProjectCard(entry.student || "Studente", entry.name, entry.url);
          projectsArea.appendChild(card);
        }
      });
    }

    function createProjectCard(studentName, projectName, projectUrl) {
      const div = document.createElement('div');
      div.className = 'project-card';
      div.innerHTML = `
                <div class="student-name">${studentName}</div>
                <div class="project-title">${projectName}</div>
                <div class="iframe-container">
                    <iframe 
                        src="${projectUrl}" 
                        allow="clipboard-read; clipboard-write; fullscreen" 
                        title="${projectName}">
                    </iframe>
                </div>
                <a href="${projectUrl}" target="_blank" class="project-link">Apri a tutto schermo 🚀</a>
            `;
      return div;
    }
  </script>
</body>

</html>
