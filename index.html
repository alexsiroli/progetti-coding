<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progetti Coding 2025/2026</title>
  <meta name="description" content="I progetti Snap! delle classi del Prof. Alex Siroli, anno scolastico 2025/2026.">
  <meta property="og:title" content="Progetti Coding 2025/2026">
  <meta property="og:description" content="I progetti Snap! delle classi del Prof. Alex Siroli.">
  <meta name="theme-color" content="#F4EAD5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1D1F27" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6 21V4' stroke='%231E2350' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M6 4.5c2.5-1.6 5-1.6 7.5 0s5 1.6 7.5 0v9c-2.5 1.6-5 1.6-7.5 0s-5-1.6-7.5 0z' fill='%232BA84A' stroke='%231D7A34' stroke-width='1.5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-next-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- bandiera verde di Snap! -->
    <symbol id="i-flag" viewBox="0 0 24 24">
      <path d="M6 21V4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
      <path d="M6 4.5c2.5-1.6 5-1.6 7.5 0s5 1.6 7.5 0v9c-2.5 1.6-5 1.6-7.5 0s-5-1.6-7.5 0z" style="fill:var(--flag);stroke:var(--flag-deep)" stroke-width="1.5" stroke-linejoin="round" />
    </symbol>
    <!-- icone Tabler (MIT) -->
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></symbol>
    <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6" /><path d="M11 13l9 -9" /><path d="M15 4h5v5" /></symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6 -6" /><path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464" /><path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463" /></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10" /></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></symbol>
  </svg>

  <main id="app" data-testid="app">
    <noscript>
      <p class="notice">Per vedere i progetti serve JavaScript.</p>
    </noscript>
  </main>

  <footer class="site-foot">
    <p>Progetti realizzati con <a href="https://snap.berkeley.edu/" target="_blank" rel="noopener">Snap!</a> dell'Università di Berkeley.</p>
    <p>Prof. Alex Siroli</p>
  </footer>

  <dialog class="player" id="player" aria-labelledby="player-who" data-testid="player">
    <div class="player-card">
      <header class="player-head">
        <div>
          <h2 id="player-who"></h2>
          <p id="player-meta"></p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Chiudi">
          <svg aria-hidden="true"><use href="#i-x" /></svg>
        </button>
      </header>
      <div class="player-stage" id="player-stage"></div>
      <footer class="player-foot">
        <a class="btn" id="player-open" href="#" target="_blank" rel="noopener">
          <svg aria-hidden="true"><use href="#i-external" /></svg>Apri su Snap!
        </a>
        <button type="button" class="btn" id="player-copy">
          <svg aria-hidden="true"><use href="#i-link" /></svg><span>Copia il link</span>
        </button>
      </footer>
    </div>
  </dialog>
</body>

</html>
